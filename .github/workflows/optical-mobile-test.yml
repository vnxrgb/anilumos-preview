name: Build experimental optical mobile
# Combined eight-feature mobile beta: rebuild after Compose LazyRow compile fixes.

on:
  push:
    branches: [main]
    paths: ['.github/workflows/optical-mobile-test.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: optical-mobile-test
  cancel-in-progress: false

jobs:
  mobile:
    name: Test, package and publish mobile/tablet beta
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: release
    env:
      ANILIST_CLIENT_ID: ${{ vars.ANILIST_CLIENT_ID }}
      MAL_CLIENT_ID: ${{ vars.MAL_CLIENT_ID }}
      SIMKL_CLIENT_ID: ${{ vars.SIMKL_CLIENT_ID }}
      DISCORD_APPLICATION_ID: ${{ vars.DISCORD_APPLICATION_ID }}
      DISCORD_INVITE_URL: ${{ vars.DISCORD_INVITE_URL }}
      MAL_REDIRECT_URI: ${{ vars.MAL_REDIRECT_URI }}
      ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
      ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
      ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
      ANDROID_SIGNING_KEY_ALIAS: ${{ vars.ANDROID_SIGNING_KEY_ALIAS }}
      ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
    steps:
      - name: Check out mobile source branch only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: vnxrgb/Anilumos
          ref: feature/bit-chord-glass-redesign
          persist-credentials: false

      - name: Record precise source revision
        id: source
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=mobile-beta-signed-${sha:0:12}-run${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Require working OAuth configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in ANILIST_CLIENT_ID MAL_CLIENT_ID MAL_REDIRECT_URI; do
            value="${!name:-}"
            if [[ -z "${value//[[:space:]]/}" ]]; then
              echo "::error::Configure preview repository Actions variable $name before publishing a test APK."
              exit 1
            fi
          done
          case "$MAL_REDIRECT_URI" in
            http://localhost/|https://localhost/|anilife://auth/mal) ;;
            *) echo "::error::Unexpected MAL redirect URI"; exit 1 ;;
          esac

      - name: Check optional integration configuration
        shell: bash
        run: |
          for name in SIMKL_CLIENT_ID DISCORD_APPLICATION_ID DISCORD_INVITE_URL; do
            if [[ -z "${!name:-}" ]]; then
              echo "::warning::$name is not configured; its integration may be unavailable."
            fi
          done

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: false

      - name: Require and restore protected release signing key
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_SIGNING_KEYSTORE_BASE64 ANDROID_SIGNING_STORE_PASSWORD ANDROID_SIGNING_KEY_PASSWORD ANDROID_SIGNING_KEY_ALIAS ANDROID_SIGNING_CERT_SHA256; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing preview repository signing secret or variable $name"
              exit 1
            fi
          done
          mkdir -p .release
          printf '%s' "$ANDROID_SIGNING_KEYSTORE_BASE64" | base64 --decode > .release/anilumos-release.jks
          chmod 600 .release/anilumos-release.jks
          {
            printf 'storeFile=.release/anilumos-release.jks\n'
            printf 'storePassword=%s\n' "$ANDROID_SIGNING_STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_SIGNING_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_SIGNING_KEY_PASSWORD"
          } > keystore.properties
          chmod 600 keystore.properties

      - name: Mobile unit tests, lint and release-signed assembly
        run: ./gradlew :app:testMobileDebugUnitTest :app:lintMobileDebug :app:assembleMobileRelease --max-workers=2 --no-configuration-cache --console=plain

      - name: Check mobile package and signing
        shell: bash
        run: |
          set -euo pipefail
          # The build intentionally produces two ABI splits plus one universal APK.
          # Only publish the explicitly named universal artifact.
          apk="app/build/outputs/apk/mobile/release/Anilumos.apk"
          if [[ ! -s "$apk" ]]; then
            echo "::error::Universal mobile release APK missing at $apk"
            ls -lah app/build/outputs/apk/mobile/release/ || true
            exit 1
          fi
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose "$apk"
          fingerprint="$("$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          [[ -n "$fingerprint" && "${fingerprint,,}" == "${ANDROID_SIGNING_CERT_SHA256,,}" ]] || {
            echo "::error::Signer does not match the pinned AniLumos release certificate"
            exit 1
          }
          badging="$("$ANDROID_HOME/build-tools/35.0.1/aapt" dump badging "$apk")"
          grep -Fq "name='com.anilumos.app'" <<< "$badging"
          if grep -Fq 'android.intent.category.LEANBACK_LAUNCHER' <<< "$("$ANDROID_HOME/build-tools/35.0.1/aapt" dump xmltree "$apk" AndroidManifest.xml)"; then
            echo "::error::Mobile preview unexpectedly carries a TV launcher"
            exit 1
          fi
          mkdir -p dist
          cp "$apk" dist/AniLumos-OPTICAL-MOBILE-test.apk
          (cd dist && sha256sum AniLumos-OPTICAL-MOBILE-test.apk > SHA256SUMS)

      - name: Upload signed optical mobile test
        uses: actions/upload-artifact@v4
        with:
          name: AniLumos-OPTICAL-MOBILE-test
          path: |
            dist/AniLumos-OPTICAL-MOBILE-test.apk
            dist/SHA256SUMS
          if-no-files-found: error
