          printf '%s\n' "$fingerprint" > dist/SIGNING-CERTIFICATE-SHA256.txt
          (cd dist && sha256sum Anilumos.apk SIGNING-CERTIFICATE-SHA256.txt > SHA256SUMS)
          printf '%s\n' "AniLumos Manga Reader preview: $(git rev-parse HEAD)" > dist/BUILD-REVISION.txt

      - name: Publish experimental prerelease (never latest)
        shell: bash
        run: |
          set -euo pipefail
          tag="manga-reader-preview-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          gh release create "$tag" dist/Anilumos.apk dist/SHA256SUMS dist/SIGNING-CERTIFICATE-SHA256.txt dist/BUILD-REVISION.txt --repo vnxrgb/anilumos-preview --target "$GITHUB_SHA" --title "AniLumos Manga Reader — signed mobile beta" --notes "$(printf '%s\n\n%s\n%s\n%s\n' "$(printf '%s\n' '- Tap the AniLumos logo to switch between Anime and Manga.' '- Shared Anime UI components and redesigned manga provider picker.' '- Advanced reader settings, page layouts, filters, chapter bookmarks and customizable controls.')" 'Based on [AniLife](https://github.com/anilifecommunity/android-and-tv).' 'This app uses code from [Morphe](https://morphe.software).' 'See LICENSE and notices for applicable terms.')" --prerelease --latest=false
          echo "APK: https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/Anilumos.apk" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove restored signing material
        if: always()
        shell: bash
        run: rm -f keystore.properties .release/anilumos-release.jks
