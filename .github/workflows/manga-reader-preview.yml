name: Signed Manga Reader mobile preview

on:
  push:
    branches: [main]
    paths: ['.github/workflows/manga-reader-preview.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: anilumos-manga-reader-preview
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8

jobs:
  publish:
    name: Verify, sign and publish universal mobile APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: release
    env:
      ANILIST_CLIENT_ID: ${{ vars.ANILIST_CLIENT_ID }}
      MAL_CLIENT_ID: ${{ vars.MAL_CLIENT_ID }}
      MAL_REDIRECT_URI: ${{ vars.MAL_REDIRECT_URI }}
      SIMKL_CLIENT_ID: ${{ vars.SIMKL_CLIENT_ID }}
      DISCORD_APPLICATION_ID: ${{ vars.DISCORD_APPLICATION_ID }}
      DISCORD_INVITE_URL: ${{ vars.DISCORD_INVITE_URL }}
      DIAGNOSTICS_UPLOAD_URL: ${{ vars.DIAGNOSTICS_UPLOAD_URL }}
      OPEN_SUBTITLES_API_KEY: ${{ secrets.OPEN_SUBTITLES_API_KEY }}
      KARTOONS_ACCOUNT_TOKENS: ${{ secrets.KARTOONS_ACCOUNT_TOKENS }}
      KARTOONS_TOKENS_MIRROR_URL: ${{ vars.KARTOONS_TOKENS_MIRROR_URL }}
      RIFT_FIREBASE_API_KEY: ${{ secrets.RIFT_FIREBASE_API_KEY }}
      ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
      ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
      ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
      ANDROID_SIGNING_KEY_ALIAS: ${{ vars.ANDROID_SIGNING_KEY_ALIAS }}
      ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require successful restored-player preview
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            result="$(gh api repos/vnxrgb/anilumos-preview/actions/runs/45880141454 --jq '[.status,.conclusion,.head_sha] | @tsv')"
            status="$(cut -f1 <<< "$result")"
            conclusion="$(cut -f2 <<< "$result")"
            revision="$(cut -f3 <<< "$result")"
            test "$revision" = "447c437f6c9015acd693b6170b7a77400ac7add4"
            if [[ "$status" == "completed" ]]; then
              if [[ "$conclusion" == "success" ]]; then exit 0; fi
              echo "::error::Restored player preview did not succeed: $conclusion"
              exit 1
            fi
            sleep 15
          done
          echo "::error::Restored player validation did not complete within the gate window."
          exit 1

      # Build the exact corrected manga revision; release requires tests, lint and signing checks.
      - name: Check out experimental branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: vnxrgb/Anilumos
          ref: 41cb324db06610724103076bd49d6b8ebe7c2398
          persist-credentials: false

      - name: Require successful validation of this exact source revision
        shell: bash
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          for attempt in $(seq 1 120); do
            result="$(gh api "repos/vnxrgb/Anilumos/actions/runs?head_sha=$revision&per_page=20" --jq '[.workflow_runs[] | select(.name == "Manga reader validation")] | first | [.status,.conclusion] | @tsv')"
            if [[ "$result" == completed and MyAnimeList OAuth configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in ANILIST_CLIENT_ID MAL_CLIENT_ID MAL_REDIRECT_URI; do
            value="${!name:-}"
            if [[ -z "${value//[[:space:]]/}" ]]; then
              echo "::error::Missing required OAuth setting: $name. Refusing to publish an APK with broken account login."
              exit 1
            fi
          done

      - name: Check protected signing configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_SIGNING_KEYSTORE_BASE64 ANDROID_SIGNING_STORE_PASSWORD ANDROID_SIGNING_KEY_PASSWORD ANDROID_SIGNING_KEY_ALIAS ANDROID_SIGNING_CERT_SHA256; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required release signing secret or variable: $name"
              exit 1
            fi
          done

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: false

      - name: Restore protected signing keystore
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_SIGNING_KEYSTORE_BASE64"
          test -n "$ANDROID_SIGNING_STORE_PASSWORD"
          test -n "$ANDROID_SIGNING_KEY_PASSWORD"
          test -n "$ANDROID_SIGNING_KEY_ALIAS"
          test -n "$ANDROID_SIGNING_CERT_SHA256"
          mkdir -p .release
          printf '%s' "$ANDROID_SIGNING_KEYSTORE_BASE64" | base64 --decode > .release/anilumos-release.jks
          chmod 600 .release/anilumos-release.jks
          {
            printf 'storeFile=.release/anilumos-release.jks\n'
            printf 'storePassword=%s\n' "$ANDROID_SIGNING_STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_SIGNING_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_SIGNING_KEY_PASSWORD"
          } > keystore.properties
          chmod 600 keystore.properties

      - name: Unit tests, lint and signed mobile release build
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if ./gradlew :app:testMobileDebugUnitTest :app:lintMobileDebug :app:assembleMobileRelease --max-workers=2 --no-configuration-cache --console=plain > gradle-build.log 2>&1; then
              cat gradle-build.log
              exit 0
            fi
            cat gradle-build.log
            if ! grep -Eq 'Received status code 429|Too Many Requests|HTTP 429' gradle-build.log; then exit 1; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 120))
          done

      - name: Verify universal release APK and signer's identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          apk="app/build/outputs/apk/mobile/release/Anilumos.apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/35.0.1/zipalign" -c -P 16 4 "$apk"
          fingerprint="$("$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          test -n "$fingerprint"
          test "${fingerprint,,}" = "${ANDROID_SIGNING_CERT_SHA256,,}"
          package_line="$("$ANDROID_HOME/build-tools/35.0.1/aapt" dump badging "$apk" | head -n 1)"
          [[ "$package_line" == *"name='com.anilumos.app'"* ]]
          cp "$apk" dist/Anilumos.apk
          printf '%s\n' "$fingerprint" > dist/SIGNING-CERTIFICATE-SHA256.txt
          (cd dist && sha256sum Anilumos.apk SIGNING-CERTIFICATE-SHA256.txt > SHA256SUMS)
          printf '%s\n' "AniLumos Manga Reader preview: $(git rev-parse HEAD)" > dist/BUILD-REVISION.txt

      - name: Preserve signed universal APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: signed-manga-mobile
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Publish experimental prerelease (never latest)
        shell: bash
        run: |
          set -euo pipefail
          tag="manga-reader-preview-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          gh release create "$tag" dist/Anilumos.apk dist/SHA256SUMS dist/SIGNING-CERTIFICATE-SHA256.txt dist/BUILD-REVISION.txt --repo vnxrgb/anilumos-preview --target "$GITHUB_SHA" --title "AniLumos Manga Reader — signed mobile beta" --notes "$(printf '%s\n\n%s\n%s\n%s\n' "$(printf '%s\n' '- Tap the AniLumos logo to switch between Anime and Manga.' '- Shared Anime UI components and redesigned manga provider picker.' '- Advanced reader settings, page layouts, filters, bookmarks and customizable controls.' '- Provider management, presets, reading collections and local CBZ/ZIP import.')" 'Based on [AniLife](https://github.com/anilifecommunity/android-and-tv).' 'This app uses code from [Morphe](https://morphe.software).' 'See LICENSE and notices for applicable terms.')" --prerelease --latest=false
          echo "APK: https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/Anilumos.apk" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove restored signing material
        if: always()
        shell: bash
        run: rm -f keystore.properties .release/anilumos-release.jks
\t'success ]]; then exit 0; fi
