name: Publish TV signed preview

on:
  push:
    branches: [main]
    paths: ['.github/workflows/tv-preview.yml']
  workflow_dispatch:
  schedule:
    - cron: '47 */6 * * *'

permissions:
  contents: write

concurrency:
  group: preview-tv-signed-release
  cancel-in-progress: false

jobs:
  tv:
    name: Test, package and publish Android TV / Fire TV alpha
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: release
    env:
      ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
      ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
      ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
      ANDROID_SIGNING_KEY_ALIAS: ${{ vars.ANDROID_SIGNING_KEY_ALIAS }}
      ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
    steps:
      - name: Check out TV source branch only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: vnxrgb/Anilumos
          ref: feature/tv-polish
          persist-credentials: false

      - name: Record precise source revision
        id: source
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=tv-alpha-signed-${sha:0:12}-run${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Skip if this source revision already has a signed preview
        id: preview_guard
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sha="${{ steps.source.outputs.sha }}"
          prefix="tv-alpha-signed-${sha:0:12}-run"
          if gh release list --repo vnxrgb/anilumos-preview --limit 100 --json tagName \
              | jq -e --arg prefix "$prefix" '[.[] | select(.tagName | startswith($prefix))] | length > 0' >/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Signed preview already exists for $sha. Skipping duplicate build." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        if: steps.preview_guard.outputs.skip != 'true'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Gradle wrapper
        if: steps.preview_guard.outputs.skip != 'true'
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up Gradle
        if: steps.preview_guard.outputs.skip != 'true'
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: false

      - name: Require and restore protected release signing key
        if: steps.preview_guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_SIGNING_KEYSTORE_BASE64 ANDROID_SIGNING_STORE_PASSWORD ANDROID_SIGNING_KEY_PASSWORD ANDROID_SIGNING_KEY_ALIAS ANDROID_SIGNING_CERT_SHA256; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing preview repository signing secret or variable $name"
              exit 1
            fi
          done
          mkdir -p .release
          printf '%s' "$ANDROID_SIGNING_KEYSTORE_BASE64" | base64 --decode > .release/anilumos-release.jks
          chmod 600 .release/anilumos-release.jks
          {
            printf 'storeFile=.release/anilumos-release.jks\n'
            printf 'storePassword=%s\n' "$ANDROID_SIGNING_STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_SIGNING_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_SIGNING_KEY_PASSWORD"
          } > keystore.properties
          chmod 600 keystore.properties

      - name: TV unit tests, lint and release-signed assembly
        if: steps.preview_guard.outputs.skip != 'true'
        run: ./gradlew :app:testTvDebugUnitTest :app:lintTvDebug :app:assembleTvRelease --max-workers=2 --no-configuration-cache --console=plain

      - name: Check TV package and signing
        if: steps.preview_guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/tv/release/Anilumos_tv.apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose "$apk"
          fingerprint="$("$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          [[ -n "$fingerprint" && "${fingerprint,,}" == "${ANDROID_SIGNING_CERT_SHA256,,}" ]] || {
            echo "::error::Signer does not match the pinned AniLumos release certificate"
            exit 1
          }
          badging="$("$ANDROID_HOME/build-tools/35.0.1/aapt" dump badging "$apk")"
          grep -Fq "name='com.anilumos.app'" <<< "$badging"
          grep -Fq "uses-feature-not-required: name='android.hardware.touchscreen'" <<< "$badging"
          manifest="$("$ANDROID_HOME/build-tools/35.0.1/aapt" dump xmltree "$apk" AndroidManifest.xml)"
          grep -Fq 'android.intent.category.LEANBACK_LAUNCHER' <<< "$manifest"
          mkdir -p dist
          cp "$apk" dist/AniLumos-TV-ALPHA-signed.apk
          (cd dist && sha256sum AniLumos-TV-ALPHA-signed.apk > SHA256SUMS)

      - name: Publish permanent experimental TV release
        if: steps.preview_guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: vnxrgb/anilumos-preview
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          TAG: ${{ steps.source.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite tested binaries."
            exit 0
          fi
          cat > notes.md <<EOF
          **ANDROID TV / AMAZON FIRE TV ALPHA — RELEASE-SIGNED, EXPERIMENTAL, NOT FOR PHONES**

          Source: [vnxrgb/Anilumos@${SOURCE_SHA}](https://github.com/vnxrgb/Anilumos/commit/${SOURCE_SHA})
          Branch: 'feature/tv-polish'

          Unit tests, TV lint, APK packaging and release certificate fingerprint verified in this workflow.
          Remote navigation, playback, QR pairing and low-end Fire TV performance still need physical testing.
          Release-signed package: 'com.anilumos.app'. Compatible upgrades require Android to accept this version code and matching signing certificate.

          AniLife: https://github.com/anilifecommunity/android-and-tv
          This app uses code from Morphe. To learn more, visit https://morphe.software
          See the source repository's LICENSE and notices.
          EOF
          # Explicit repository target matters because checkout pulls source from a different repo.
          # Log a specific publishing-permission failure without exposing credentials.
          if ! gh release create "$TAG" dist/AniLumos-TV-ALPHA-signed.apk \
            --repo vnxrgb/anilumos-preview \
            --target "$GITHUB_SHA" --prerelease --title "TV / Fire TV ALPHA | ${SOURCE_SHA:0:12}" --notes-file notes.md; then
            echo "::error::TV build and release signature passed, but GitHub denied prerelease creation. Check preview repository Actions token permissions and release policy."
            exit 1
          fi
          echo "TV prerelease: https://github.com/$GH_REPO/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
